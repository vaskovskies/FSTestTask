<header class="app-header">
  <h1 class="app-title">Lumana Task</h1>
  <nav class="app-nav" aria-label="Main navigation">
    <button
      class="nav-link"
      [class.active]="currentView() === 'search'"
      (click)="switchView('search')"
    >Search</button>
    <button
      class="nav-link"
      [class.active]="currentView() === 'reports'"
      (click)="switchView('reports')"
    >Reports</button>
  </nav>
</header>

<main class="app-main">
  @if (currentView() === 'search') {
    <app-search />
  } @else {
    <app-report-form />
  }
</main>
