<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ result()?.title }}</h2>
    <button (click)="closeDialog()" class="close-button" aria-label="Close dialog">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="dialog-content">
    <div class="canvas-container">
      @if (!imageLoaded()) {
        <div class="loading-container">
          <div class="loading-spinner"></div>
          <p>Loading image...</p>
        </div>
      }
      <canvas
        #canvas
        (click)="onCanvasClick($event)"
        (dblclick)="onCanvasDoubleClick($event)"
        (mousedown)="onCanvasMouseDown($event)"
        (mousemove)="onCanvasMouseMove($event)"
        (mouseup)="onCanvasMouseUp()"
        class="image-canvas"
        [class.hidden]="!imageLoaded()"
      ></canvas>
    </div>

    @if (imageLoaded()) {
      <div class="controls">
        <div class="mode-toggle">
          <button
            (click)="toggleDrawMode()"
            [class.active]="isDrawMode()"
            class="mode-button"
          >
            @if (isDrawMode()) {
              <span class="button-icon" aria-hidden="true">&#9998;</span> Draw Mode
            } @else {
              <span class="button-icon" aria-hidden="true">&#9757;</span> Select Mode
            }
          </button>
        </div>

        @if (!isDrawMode() && selectedPolygon()) {
          <div class="polygon-controls">
            <button
              (click)="rotateSelectedPolygon()"
              class="control-button"
              aria-label="Rotate polygon 15 degrees"
            >
              <span aria-hidden="true">&#8635;</span> Rotate
            </button>
            <button
              (click)="deleteSelectedPolygon()"
              class="control-button delete"
              aria-label="Delete selected polygon"
            >
              <span aria-hidden="true">&#128465;</span> Delete
            </button>
          </div>
        }

        <div class="instructions">
          @if (isDrawMode()) {
            <p>Click to add points, double-click to complete polygon</p>
          } @else {
            <p>Click on a polygon to select it, drag to move</p>
          }
        </div>
      </div>
    }
  </div>
</div>
