syntax = "proto3";

package logs;

option go_package = "backend/services/service-b/pkg/pb;pb";

service LogService {
  rpc LogEvent (LogEventRequest) returns (LogEventResponse);
  rpc GetLogs (GetLogsRequest) returns (GetLogsResponse);
  rpc GenerateReport (GenerateReportRequest) returns (GenerateReportResponse);
}

message LogEventRequest {
  string service = 1;
  string action = 2;
  string payload = 3;
  string level = 4;
  int64 timestamp = 5;
}

message LogEventResponse {
  bool success = 1;
  string log_id = 2;
}

message GetLogsRequest {
  string action = 1;
  string service = 2;
  string start_date = 3;
  string end_date = 4;
  int32 page = 5;
  int32 limit = 6;
}

message LogEntry {
  string id = 1;
  string service = 2;
  string action = 3;
  string payload = 4;
  string level = 5;
  int64 timestamp = 6;
}

message GetLogsResponse {
  repeated LogEntry logs = 1;
  int64 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GenerateReportRequest {
  string metric_name = 1;
  int64 start_timestamp = 2;
  int64 end_timestamp = 3;
}

message GenerateReportResponse {
  bytes pdf_content = 1;
  string filename = 2;
}
